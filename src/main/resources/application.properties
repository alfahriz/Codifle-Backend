# =============================================================
#  CODIFLE API — application.properties
# =============================================================

# --- Server ---
quarkus.http.port=8080

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:changeme}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/codifle}

# --- Swagger / OpenAPI ---
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Codifle API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=Company Profile Platform API

# --- JWT ---
mp.jwt.verify.issuer=https://codifle.com
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
quarkus.smallrye-jwt.enabled=true
# Private key for signing — DO NOT commit the actual key file
smallrye.jwt.sign.key.location=privateKey.pem

# --- Rate Limiting (see RateLimitFilter.java) ---
# General endpoints : 120 req/min per IP
# Sensitive endpoints (/contact/submit, /auth/login) : 5 req/min per IP

# --- CORS ---
# In production: replace * with your actual frontend domain
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:*}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# --- Site ---
# Used in sitemap.xml and robots.txt
codifle.site.base-url=${SITE_BASE_URL:https://codifle.com}
